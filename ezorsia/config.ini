[general]
;IME 修复方案，只有0和1两种，优先尝试方案1（更完美），如果会卡门再尝试方案0
imeType=1
; 启动 / 登录 / 选角色窗口：保持 width×height
width=1280
height=720
; 选角色进图后的分辨率档位（登出/重登只恢复登录尺寸，不清除此项）
; 登录窗口 = width/height；进图 = soScreenResolution。旧档 0-8 的 W×H 永不改号。
; 0=800x600  1=1024x768  2=1366x768  3=1600x900  4=1920x1080
; 5=1280x720  6=1440x900  7=1680x1050  8=2560x1440
; 9=1440x720  10=1600x720  11=1600x768  12=1800x720  13=1920x720
; 14=1920x768  15=2240x720  16=2560x720  17=2560x768  18=2560x1080
soScreenResolution=2
;服务器地址
ServerIP_Address=127.0.0.1
serverIP_Port=8484
;加载文字汉化
SwitchChinese=true
;右下角消息数量
MsgAmount=10
;does your UI.wz include the MapleEzorsiaV2wzfiles.img? (true/false, default true if using UI.wz provided in setup guide)
EzorsiaV2WzIncluded=true
;is a resolution specific login frame being used in UI.wz? (true/false, default true if EzorsiaV2WzIncluded=true)
;somewhat obselete, mostly kept for ppl who wanna use their own login frame by directly editing the original frame in wz
CustomLoginFrame=true
;开启后登录界面的UI会按大边框布局，请确保UI使用了大边框才开启
bigLoginFrame=true
;窗口模式
WindowedMode=true
;跳过开头的动画
RemoveLogos=true
;Should VirtuProtect be enabled? (true/false, default true) (this is necessary for clients without CRC bypass such as hendi's clients
;that havent been editted further, can be turned off for clients with CRC bypass to save whatever processing power it uses)
UseVirtuProtect=true

[optional]
;物理攻击 面板上限
setDamageCap=199999
;魔攻/魔防 面板上限
setMAtkCap=1999
;命中上限
setAccCap=999
;回避上限
setAvdCap=999
;真实输出上限
setAtkOutCap=199999
;移速上限
speedMovementCap=140
;跳跃上限
jumpCap=123
;爬绳速度自适应：true=随移动速度变化；false=固定值
climbSpeedAuto=false
;爬绳基础速度系数
climbSpeed=1.0
;一种超级机制，不开启的话，升级属性点/技能点会停顿1秒，宠物捡取时攻击会停下来
useTubi=true
;did you wz edit UI/Login.img/Common/frame to something else and are using it?(true/false, default false)
ownLoginFrame=false
;did you wz edit the cashshop backgrnd(s) to something else and are using it?(true/false, default false)
ownCashShopFrame=false
; 允许重复发言相同内容
talkRepeat=false
; 连续说话限制 (毫秒)
talkTime=2000
; Buff 剩余时间浮层（BuffTimerMod；默认开）
enableBuffTimer=true
; BuffTimer 诊断写 bufftimer.log（默认关；开会在主线程刷盘易卡）
enableBuffTimerDiag=false
; 选区后自动聚焦频道（回车进1线）
quickLogin=true
; 允许现金道具进入交易栏（客户端 NOP）
allowCashTrade=true
; 空中释放技能（跳跃中可施法；Rush 除外）
enableAirSkill=true
; 装备成长旁挂 tip（拆分在成长 tip；主 tip 只显示合计）
enableGrowthCompanion=true
; 第二吊坠/护肩/六戒 UI：进图后挂 GetSlotXY+HitTest+extra-pendant flag（禁 ForceDrawLoop）
; false=仅属性；缺省 false。护肩红/戒指错槽/全身红时务必为 true
pendant2_ui=true

[debug]
debug=false
;免密模式，解除客户端密码限制（须先开启debug）
noPassword=false
;开发自测（默认关）：启动时主动 AV，验证 beidou-crash.log（会进原异常流程并退出）
CrashDiagTestAV=false
;开发自测（默认关）：启动时触发一次 E_POINTER，验证 beidou-com-error.log
CrashDiagTestEPointer=false

[miraclecube]
; 1=仅聊天提示魔方结果（稳妥）；0=弹窗需 UIWindow2 MiracleCube 节点
DisablePopup=1

